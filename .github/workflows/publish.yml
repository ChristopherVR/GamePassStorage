name: Publish to NuGet

# Publishes the GamePassStorage library, the game adapter packages (GamePassStorage.Adapters.*) and the
# `wgs` tool (GamePassStorage.Tool) to nuget.org.
# Trigger: push a version tag (git tag v0.1.0 && git push origin v0.1.0), or run it by hand.
# Needs a repository secret NUGET_API_KEY (an nuget.org API key scoped to push these packages).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (for example 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a semantic version"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test GamePassStorage.slnx -c Release

      - name: Pack
        run: |
          dotnet pack src/GamePassStorage -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}
          dotnet pack src/GamePassStorage.Adapters.AbioticFactor -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}
          dotnet pack src/GamePassStorage.Tool -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NUGET_API_KEY repository secret is not set."; exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.value }}
          path: artifacts/*.nupkg

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
